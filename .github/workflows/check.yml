# PR마다 scripts/check.py 와 같은 점검을 돈다. Docker·GPU 없음. 약 3분.
name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Python deps (CPU torch — recorder 테스트용)
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet pytest numpy -e packages/telemetry -e apps/host
      - name: pytest
        run: python -m pytest -q apps/host/tests packages/telemetry/tests

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: web build
        working-directory: apps/web
        run: npm ci && npm run build
